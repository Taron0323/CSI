name: Formal V2 CPU CI

on:
  pull_request:
    paths:
      - ".github/workflows/formal-v2-cpu-ci.yml"
      - "code/CSI-PAIRS-v2.0-server/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/formal-v2-cpu-ci.yml"
      - "code/CSI-PAIRS-v2.0-server/**"

permissions:
  contents: read

concurrency:
  group: formal-v2-cpu-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: code/CSI-PAIRS-v2.0-server
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      CSI_PAIRS_PYTHON: python

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: code/CSI-PAIRS-v2.0-server/formal_v2/requirements-lock.txt

      - name: Install locked CPU test environment
        run: |
          python -m pip install --requirement formal_v2/requirements-lock.txt
          python -m pip check

      - name: Compile, validate, and test
        run: |
          python -m compileall -q formal_v2
          python -m unittest discover -s formal_v2/tests -v
          python - <<'PY'
          from formal_v2.formal_config import load_formal_config

          load_formal_config("formal_v2/configs/formal_v2.json")
          load_formal_config("formal_v2/configs/formal_v2_smoke.json")
          PY
          find formal_v2 -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
          sha256sum --check SHA256SUMS
          (
            cd formal_v2/external_adapters/vendor/Wi-GATr
            sha256sum --check VENDOR_SHA256SUMS
          )

      - name: Rebuild and verify deterministic deliveries
        run: |
          delivery_dir="$(mktemp -d)"
          trap 'rm -rf "${delivery_dir}"' EXIT

          formal_v2/scripts/build_server_bundle.sh "${delivery_dir}/server-a.zip"
          formal_v2/scripts/build_server_bundle.sh "${delivery_dir}/server-b.zip"
          cmp -s "${delivery_dir}/server-a.zip" "${delivery_dir}/server-b.zip"
          (
            cd "${delivery_dir}"
            sha256sum --check server-a.zip.sha256
            sha256sum --check server-b.zip.sha256
          )
          if unzip -Z1 "${delivery_dir}/server-a.zip" | grep -E '/waibu/(2502\.11965v2|2505\.09160v2|2601\.03789v1|2604\.07086v1)\.pdf$'; then
            echo "server delivery contains a nonredistributable resource" >&2
            exit 1
          fi

          formal_v2/scripts/build_anonymous_supplement.sh "${delivery_dir}/anonymous-a.zip"
          formal_v2/scripts/build_anonymous_supplement.sh "${delivery_dir}/anonymous-b.zip"
          cmp -s "${delivery_dir}/anonymous-a.zip" "${delivery_dir}/anonymous-b.zip"
          (
            cd "${delivery_dir}"
            sha256sum --check anonymous-a.zip.sha256
            sha256sum --check anonymous-b.zip.sha256
          )
          if unzip -Z1 "${delivery_dir}/anonymous-a.zip" | grep '/waibu/'; then
            echo "anonymous supplement contains third-party resource bytes" >&2
            exit 1
          fi

          mkdir "${delivery_dir}/server-extracted"
          unzip -q "${delivery_dir}/server-a.zip" -d "${delivery_dir}/server-extracted"
          CSI_PAIRS_PYTHON=python \
            "${delivery_dir}/server-extracted/CSI-PAIRS-v2.1-server/formal_v2/scripts/verify_server_bundle.sh" \
            "${delivery_dir}/dry-run"

          mkdir "${delivery_dir}/anonymous-extracted"
          unzip -q "${delivery_dir}/anonymous-a.zip" -d "${delivery_dir}/anonymous-extracted"
          (
            cd "${delivery_dir}/anonymous-extracted/CSI-PAIRS-anonymous-supplement"
            sha256sum --check SHA256SUMS
            python -m unittest discover -s formal_v2/tests -v
          )
